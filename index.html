<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Faciliation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 25%, #7dd3fc 50%, #38bdf8 75%, #0ea5e9 100%);
            background-attachment: fixed;
            color: #0c4a6e;
            min-height: 100vh;
            padding: 10px 10px 40px 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 450px 1fr;
            gap: 20px;
            height: calc(100vh - 50px);
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            padding: 0;
            margin-top: 30px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 700;
            color: #075985;
            margin: 0;
            line-height: 1.2;
        }

        .header p {
            color: #0369a1;
            font-size: 16px;
            margin-top: 2px;
            line-height: 1.2;
        }

        /* Sidebar - Member Roster */
        .sidebar {
            background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(224,242,254,0.9) 100%);
            border-radius: 16px;
            padding: 15px;
            overflow-y: auto;
            max-height: calc(100vh - 200px);
            border: 1px solid rgba(14, 165, 233, 0.2);
        }

        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #075985;
            font-weight: 600;
        }

        .member-filter {
            margin-bottom: 10px;
        }

        .member-filter select {
            width: 100%;
            padding: 12px;
            border: 2px solid #7dd3fc;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #0c4a6e;
            background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 100%);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .member-filter select:hover {
            border-color: #0ea5e9;
        }

        .member-filter select:focus {
            outline: none;
            border-color: #0284c7;
        }

        .member-search {
            margin-bottom: 10px;
        }

        .member-search input {
            width: 100%;
            padding: 12px;
            border: 2px solid #7dd3fc;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Outfit', sans-serif;
            color: #0c4a6e;
            background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 100%);
            transition: all 0.2s ease;
        }

        .member-search input::placeholder {
            color: #64748b;
        }

        .member-search input:hover {
            border-color: #0ea5e9;
        }

        .member-search input:focus {
            outline: none;
            border-color: #0284c7;
        }

        .member-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .member-card {
            background: linear-gradient(135deg, #0d9488 0%, #0891b2 50%, #0284c7 100%);
            color: white;
            padding: 10px 12px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.3s ease;
            min-height: auto;
        }

        .member-card:hover {
            background: linear-gradient(135deg, #0f766e 0%, #0e7490 50%, #0369a1 100%);
            transform: translateY(-1px);
        }

        .member-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .member-name {
            font-weight: 600;
            font-size: 14px;
            flex: 1;
            min-width: 0;
            word-wrap: break-word;
        }

        .speak-count-badge {
            background: rgba(255, 255, 255, 0.3);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
            flex-shrink: 0;
            line-height: 1;
        }

        .speak-count-badge.high {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
        }

        .member-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
            width: 100%;
        }

        .btn-small {
            font-family: 'Outfit', sans-serif;
            padding: 5px 8px;
            border: none;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex: 1;
        }

        .btn-add {
            background: rgba(255, 255, 255, 0.95);
            color: #0d9488;
        }

        .btn-add:hover {
            background: #e0f2fe;
            transform: scale(1.05);
        }

        .btn-response {
            background: rgba(255, 255, 255, 0.35);
            color: white;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .btn-response:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }

        /* Main Content Area */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 0;
            overflow-y: auto;
            height: 100%;
        }

        .current-speaker {
            background: linear-gradient(135deg, #0c4a6e 0%, #075985 30%, #0891b2 70%, #0d9488 100%);
            color: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            grid-column: 1;
            grid-row: 1;
        }

        .current-speaker.empty {
            background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%);
            color: #475569;
        }

        .current-speaker-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .current-speaker-name {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .current-speaker-count {
            font-size: 16px;
            opacity: 0.9;
        }

        .speaker-action-btn {
            width: 100%;
            grid-column: 1;
            grid-row: 2;
        }

        .response-action-btn {
            width: 100%;
            grid-column: 2;
            grid-row: 2;
        }

        .speaker-response-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr auto;
            gap: 20px;
            margin-bottom: 20px;
            align-items: stretch;
        }

        .response-queue {
            background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(224,242,254,0.85) 100%);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(14, 165, 233, 0.2);
            min-height: 200px;
            grid-column: 2;
            grid-row: 1;
        }

        .response-queue h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #075985;
            font-weight: 600;
        }

        .response-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 100px;
            flex: 1;
        }

        .response-item {
            background: linear-gradient(135deg, #0e7490 0%, #0d9488 50%, #14b8a6 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
        }

        .response-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .response-item-name {
            font-weight: 600;
            font-size: 16px;
        }

        .response-item-count {
            background: rgba(255, 255, 255, 0.3);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .stack-section {
            background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(224,242,254,0.85) 100%);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            border: 1px solid rgba(14, 165, 233, 0.2);
        }

        .stack-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #075985;
            font-weight: 600;
        }

        .stack-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            min-height: 200px;
        }

        .stack-list .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stack-item {
            background: linear-gradient(135deg, #7dd3fc 0%, #38bdf8 50%, #0ea5e9 100%);
            color: #0c4a6e;
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .stack-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .stack-position {
            background: rgba(255, 255, 255, 0.3);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .stack-item.response .stack-position {
            background: rgba(255, 255, 255, 0.3);
        }

        .stack-item-name {
            font-weight: 600;
            font-size: 16px;
        }

        .stack-item-count {
            background: rgba(255, 255, 255, 0.3);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-remove {
            background: rgba(12, 74, 110, 0.2);
            color: #075985;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-remove:hover {
            background: #0ea5e9;
            color: white;
        }

        .stack-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Outfit', sans-serif;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0891b2 0%, #0284c7 100%);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #0e7490 0%, #0369a1 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            color: white;
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #0284c7 0%, #075985 100%);
        }

        .btn-warning {
            background: linear-gradient(135deg, #38bdf8 0%, #0d9488 100%);
            color: white;
        }

        .btn-warning:hover {
            background: linear-gradient(135deg, #0ea5e9 0%, #0f766e 100%);
        }

        /* Timer - Integrated into header */
        .timer-container {
            display: flex;
            align-items: center;
            gap: 20px;
            justify-content: center;
        }

        .timer-display {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0d9488 0%, #0891b2 50%, #0284c7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .timer-display.warning {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            animation: pulse 1s infinite;
        }

        .timer-display.expired {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .timer-time {
            font-size: 40px;
            font-weight: 700;
            color: white;
            font-variant-numeric: tabular-nums;
        }

        .timer-controls {
            display: flex;
            gap: 8px;
        }

        .btn-timer {
            font-family: 'Outfit', sans-serif;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-timer-start {
            background: linear-gradient(135deg, #0d9488 0%, #059669 100%);
            color: white;
        }

        .btn-timer-pause {
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
            color: white;
        }

        .btn-timer-reset {
            background: linear-gradient(135deg, #0891b2 0%, #0284c7 100%);
            color: white;
        }

        .timer-settings {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #0284c7 0%, #075985 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            display: none;
            z-index: 2000;
            animation: slideInRight 0.3s ease;
            min-width: 300px;
        }

        .notification.show {
            display: block;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .notification-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .notification-text {
            flex: 1;
            font-size: 16px;
            font-weight: 600;
        }

        .notification-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            line-height: 1;
        }

        .notification-close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .sidebar {
                order: 3;
                max-height: none;
            }

            .main-content {
                order: 1;
            }

            .speaker-response-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto auto;
            }

            .speaker-response-container .current-speaker { grid-column: 1; grid-row: 1; }
            .speaker-response-container .response-queue { grid-column: 1; grid-row: 2; }
            .speaker-response-container .speaker-action-btn { grid-column: 1; grid-row: 3; }
            .speaker-response-container .response-action-btn { grid-column: 1; grid-row: 4; }

            .header {
                align-items: center;
            }

            .timer-container {
                width: 100%;
                justify-content: center;
            }

            .member-list {
                grid-template-columns: 1fr;
            }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>Stack Faciliation</h1>
                <p>Eighth College Student Council</p>
            </div>
            <!-- Timer - Integrated into header -->
            <div class="timer-container">
                <div class="timer-display" id="timerDisplay">
                    <div class="timer-time" id="timerTime">3:00</div>
                </div>
                <div class="timer-controls">
                    <button class="btn-timer btn-timer-start" id="timerStartBtn">Start</button>
                    <button class="btn-timer btn-timer-pause" id="timerPauseBtn">Pause</button>
                    <button class="btn-timer btn-timer-reset" id="timerResetBtn">Reset</button>
                </div>
            </div>
        </div>

        <!-- Member Roster Sidebar -->
        <div class="sidebar">
            <h2>Members</h2>
            <div class="member-filter">
                <select id="memberFilter">
                    <option value="all">All Members</option>
                    <option value="core">CORE</option>
                    <option value="asn">ASN</option>
                    <option value="cpp">CPP</option>
                    <option value="finance">Finance</option>
                    <option value="soa">SOA</option>
                    <option value="tac">TAC</option>
                </select>
            </div>
            <div class="member-search">
                <input type="text" id="memberSearch" placeholder="Search members..." autocomplete="off">
            </div>
            <div class="member-list" id="memberList"></div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Current Speaker and Response Queue -->
            <div class="speaker-response-container">
                <!-- Current Speaker -->
                <div class="current-speaker" id="currentSpeaker">
                    <div class="current-speaker-label">Current Speaker</div>
                    <div class="current-speaker-name" id="currentSpeakerName">No one speaking</div>
                    <div class="current-speaker-count" id="currentSpeakerCount"></div>
                </div>

                <!-- Response Queue -->
                <div class="response-queue">
                    <h2>Response Queue</h2>
                    <div class="response-list" id="responseList">
                        <div class="empty-state">No responses</div>
                    </div>
                </div>

                <button class="btn btn-primary speaker-action-btn" id="nextSpeakerBtn">Next Speaker →</button>
                <button class="btn btn-warning response-action-btn" id="nextResponseBtn">Next Response →</button>
            </div>

            <!-- Regular Stack Queue -->
            <div class="stack-section">
                <h2>Stack List</h2>
                <div class="stack-list" id="stackList">
                    <div class="empty-state">Stack is empty</div>
                </div>
                <div class="stack-controls">
                    <button class="btn btn-danger" id="clearStackBtn">Clear Stack</button>
                    <button class="btn btn-warning" id="resetCountsBtn">Reset All Counts</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Timer Expiration Notification -->
    <div class="notification" id="notification">
        <div class="notification-content">
            <span class="notification-text" id="notificationText"></span>
            <button class="notification-close" id="notificationClose">×</button>
        </div>
    </div>

    <script>
        // Initial member data - easily editable
        let members = [
            { name: "Aditi", speakCount: 0 },
            { name: "Aidan", speakCount: 0 },
            { name: "Alyssa", speakCount: 0 },
            { name: "Anna💅👑", speakCount: 0 },
            { name: "Ariel", speakCount: 0 },
            { name: "Bianca", speakCount: 0 },
            { name: "Brigette", speakCount: 0 },
            { name: "Caro", speakCount: 0 },
            { name: "Carina", speakCount: 0 },
            { name: "Clytie", speakCount: 0 },
            { name: "Daman", speakCount: 0 },
            { name: "Devin", speakCount: 0 },
            { name: "Erin", speakCount: 0 },
            { name: "Eva", speakCount: 0 },
            { name: "Gabriela", speakCount: 0 },
            { name: "Hailey", speakCount: 0 },
            { name: "Holly", speakCount: 0 },
            { name: "Jonah", speakCount: 0 },
            { name: "Katherine", speakCount: 0 },
            { name: "Kavya", speakCount: 0 },
            { name: "Lucia", speakCount: 0 },
            { name: "Melany", speakCount: 0 },
            { name: "Rachel", speakCount: 0 },
            { name: "Ryn", speakCount: 0 },
            { name: "Sarah", speakCount: 0 },
            { name: "Snigdha", speakCount: 0 },
            { name: "Svetlana", speakCount: 0 },
            { name: "Ximena", speakCount: 0 }
        ];

        // Member groups - easily editable
        const memberGroups = {
            "core": ["Aidan", "Rachel", "Hailey", "Robert", "Snigdha"],
            "asn": ["Hailey", "Alyssa", "Ryn", "Aditi", "Holly"],
            "cpp": ["Rachel", "Kavya", "Gabriela", "Melany", "Eva"],
            "finance": ["Snigdha", "Devin", "Ariel", "Carina", "Lucia"],
            "soa": ["Aidan", "Anna💅👑", "Ximena", "Erin"],
            "tac": ["Clytie", "Katherine", "Svetlana", "Brigette"]
        };

        let selectedFilter = "all";
        let memberSearchQuery = "";


        let stack = [];
        let responseQueue = [];
        let currentSpeaker = null;
        let originalSpeaker = null; // Track original speaker before responses
        let timerInterval = null;
        let timerSeconds = 180; // 3 minutes
        let timerRunning = false;

        // Load from localStorage if available
        function loadState() {
            const saved = localStorage.getItem('stackKeeperState');
            if (saved) {
                const state = JSON.parse(saved);
                // Don't load members from localStorage - always use the code-defined members
                // But update speakCounts for members that exist in both
                if (state.members) {
                    state.members.forEach(savedMember => {
                        const currentMember = members.find(m => m.name === savedMember.name);
                        if (currentMember) {
                            currentMember.speakCount = savedMember.speakCount;
                        }
                    });
                }
                stack = state.stack || [];
                responseQueue = state.responseQueue || [];
                currentSpeaker = state.currentSpeaker || null;
                originalSpeaker = state.originalSpeaker || null;

                // Migrate old format: if stack items are objects with isResponse property
                if (stack.length > 0 && typeof stack[0] === 'object' && stack[0].hasOwnProperty('name')) {
                    const oldStack = stack;
                    stack = [];
                    oldStack.forEach(item => {
                        if (item.isResponse) {
                            responseQueue.push(item.name);
                        } else {
                            stack.push(item.name);
                        }
                    });
                    saveState(); // Save migrated data
                }
            }
        }

        // Save to localStorage
        function saveState() {
            const state = {
                members,
                stack,
                responseQueue,
                currentSpeaker,
                originalSpeaker
            };
            localStorage.setItem('stackKeeperState', JSON.stringify(state));
        }

        // Initialize
        function init() {
            loadState();
            renderMembers();
            renderStack();
            renderResponseList();
            updateCurrentSpeaker();
            updateTimerDisplay();

            // Timer controls
            document.getElementById('timerStartBtn').addEventListener('click', startTimer);
            document.getElementById('timerPauseBtn').addEventListener('click', pauseTimer);
            document.getElementById('timerResetBtn').addEventListener('click', resetTimer);

            // Stack controls
            document.getElementById('nextSpeakerBtn').addEventListener('click', nextSpeaker);
            document.getElementById('nextResponseBtn').addEventListener('click', nextResponse);
            document.getElementById('clearStackBtn').addEventListener('click', clearStack);
            document.getElementById('resetCountsBtn').addEventListener('click', resetCounts);

            // Notification close button
            document.getElementById('notificationClose').addEventListener('click', hideNotification);

            // Member filter
            document.getElementById('memberFilter').addEventListener('change', (e) => {
                selectedFilter = e.target.value;
                renderMembers();
            });

            // Member search
            document.getElementById('memberSearch').addEventListener('input', (e) => {
                memberSearchQuery = e.target.value.trim();
                renderMembers();
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                // Don't trigger shortcuts if user is typing in an input field
                const activeElement = document.activeElement;
                const isTyping = activeElement.tagName === 'INPUT' || 
                                activeElement.tagName === 'TEXTAREA' || 
                                activeElement.isContentEditable;
                
                if (isTyping) return;

                // Enter key → Next Speaker
                if (e.key === 'Enter') {
                    e.preventDefault();
                    nextSpeaker();
                }
                
                // Down arrow key → Next Response
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    nextResponse();
                }
            });
        }

        // Render member list
        function renderMembers() {
            const container = document.getElementById('memberList');
            container.innerHTML = '';

            // Filter members based on selected filter
            let filteredMembers = members;
            if (selectedFilter !== "all" && memberGroups[selectedFilter]) {
                const groupNames = memberGroups[selectedFilter];
                filteredMembers = members.filter(member => groupNames.includes(member.name));
            }

            // Filter by search query
            if (memberSearchQuery) {
                const query = memberSearchQuery.toLowerCase();
                filteredMembers = filteredMembers.filter(member =>
                    member.name.toLowerCase().includes(query)
                );
            }

            filteredMembers.forEach((member, index) => {
                const card = document.createElement('div');
                card.className = 'member-card';

                const info = document.createElement('div');
                info.className = 'member-info';

                const name = document.createElement('span');
                name.className = 'member-name';
                name.textContent = member.name;

                const badge = document.createElement('span');
                badge.className = `speak-count-badge ${member.speakCount >= 2 ? 'high' : ''}`;
                badge.textContent = `${member.speakCount}×`;

                info.appendChild(name);
                info.appendChild(badge);

                const actions = document.createElement('div');
                actions.className = 'member-actions';

                const addBtn = document.createElement('button');
                addBtn.className = 'btn-small btn-add';
                addBtn.textContent = 'Add';
                addBtn.addEventListener('click', () => addToStack(member.name, false));

                const responseBtn = document.createElement('button');
                responseBtn.className = 'btn-small btn-response';
                responseBtn.textContent = 'Response';
                responseBtn.addEventListener('click', () => addToStack(member.name, true));

                actions.appendChild(addBtn);
                actions.appendChild(responseBtn);

                card.appendChild(info);
                card.appendChild(actions);

                container.appendChild(card);
            });
        }

        // Helper function to insert member in correct position based on speakCount
        function insertMemberInOrder(memberName, addToEnd = false) {
            const member = members.find(m => m.name === memberName);
            if (!member) return;

            if (addToEnd) {
                // Add to the very end regardless of count
                stack.push(memberName);
                return;
            }

            // Find the last position where someone has the same speakCount
            let lastSameCountIndex = -1;
            for (let i = stack.length - 1; i >= 0; i--) {
                const itemMember = members.find(m => m.name === stack[i]);
                if (itemMember && itemMember.speakCount === member.speakCount) {
                    lastSameCountIndex = i;
                    break;
                }
            }

            if (lastSameCountIndex !== -1) {
                // Insert after the last person with the same count
                stack.splice(lastSameCountIndex + 1, 0, memberName);
                return;
            }

            // No one has the same count, find the first position where someone has a higher count
            const insertIndex = stack.findIndex(memberNameInStack => {
                const itemMember = members.find(m => m.name === memberNameInStack);
                return itemMember && itemMember.speakCount > member.speakCount;
            });

            if (insertIndex === -1) {
                // Everyone has lower count, add to the end
                stack.push(memberName);
            } else {
                // Insert before the first person with higher count
                stack.splice(insertIndex, 0, memberName);
            }
        }

        // Add to stack with smart queue logic
        function addToStack(memberName, isResponse) {
            const member = members.find(m => m.name === memberName);
            if (!member) return;

            // Response queue always bypasses check
            if (isResponse) {
                // Save original speaker when first response is added while someone is speaking
                if (currentSpeaker && !originalSpeaker && responseQueue.length === 0) {
                    originalSpeaker = currentSpeaker;
                }
                responseQueue.push(memberName);
                renderResponseList();
                saveState();
                return;
            }

            // Add in order (lower counts come before higher counts)
            // This automatically places people with higher counts after those with lower counts
            insertMemberInOrder(memberName, false);
            renderStack();
            saveState();
        }

        // Render stack
        function renderStack() {
            const container = document.getElementById('stackList');
            container.innerHTML = '';

            if (stack.length === 0) {
                container.innerHTML = '<div class="empty-state">Stack is empty</div>';
                return;
            }

            stack.forEach((memberName, index) => {
                const member = members.find(m => m.name === memberName);
                if (!member) return;

                const stackItem = document.createElement('div');
                stackItem.className = 'stack-item';

                const info = document.createElement('div');
                info.className = 'stack-item-info';

                const position = document.createElement('div');
                position.className = 'stack-position';
                position.textContent = index + 1;

                const name = document.createElement('span');
                name.className = 'stack-item-name';
                name.textContent = memberName;

                const count = document.createElement('span');
                count.className = 'stack-item-count';
                count.textContent = `${member.speakCount}×`;

                info.appendChild(position);
                info.appendChild(name);
                info.appendChild(count);

                const removeBtn = document.createElement('button');
                removeBtn.className = 'btn-remove';
                removeBtn.textContent = 'Remove';
                removeBtn.addEventListener('click', () => removeFromStack(index));

                stackItem.appendChild(info);
                stackItem.appendChild(removeBtn);

                container.appendChild(stackItem);
            });
        }

        // Remove from stack
        function removeFromStack(index) {
            stack.splice(index, 1);
            renderStack();
            saveState();
        }

        // Render response list
        function renderResponseList() {
            const container = document.getElementById('responseList');
            container.innerHTML = '';

            if (responseQueue.length === 0) {
                container.innerHTML = '<div class="empty-state">No responses</div>';
                return;
            }

            responseQueue.forEach((memberName, index) => {
                const member = members.find(m => m.name === memberName);
                if (!member) return;

                const responseItem = document.createElement('div');
                responseItem.className = 'response-item';

                const info = document.createElement('div');
                info.className = 'response-item-info';

                const position = document.createElement('div');
                position.className = 'stack-position';
                position.textContent = index + 1;

                const name = document.createElement('span');
                name.className = 'response-item-name';
                name.textContent = memberName;

                const count = document.createElement('span');
                count.className = 'response-item-count';
                count.textContent = `${member.speakCount}×`;

                info.appendChild(position);
                info.appendChild(name);
                info.appendChild(count);

                const removeBtn = document.createElement('button');
                removeBtn.className = 'btn-remove';
                removeBtn.textContent = 'Remove';
                removeBtn.addEventListener('click', () => removeFromResponseQueue(index));

                responseItem.appendChild(info);
                responseItem.appendChild(removeBtn);

                container.appendChild(responseItem);
            });
        }

        // Remove from response queue
        function removeFromResponseQueue(index) {
            responseQueue.splice(index, 1);
            renderResponseList();
            saveState();
        }

        // Next speaker (only handles regular stack)
        function nextSpeaker() {
            if (currentSpeaker) {
                // Increment speak count for previous speaker
                const member = members.find(m => m.name === currentSpeaker);
                if (member) {
                    member.speakCount++;
                }
            }

            // Clear original speaker since we're moving to a completely new speaker
            originalSpeaker = null;

            // Move next person from regular stack to current speaker
            if (stack.length > 0) {
                currentSpeaker = stack[0];
                stack.shift();
            } else {
                currentSpeaker = null;
            }

            // Automatically reset timer when moving to next speaker
            resetTimer();
            // Start timer only if there's a new speaker
            if (currentSpeaker) {
                startTimer();
            }

            updateCurrentSpeaker();
            renderMembers();
            renderStack();
            saveState();
        }

        // Next response (handles responses within current speaker's time)
        function nextResponse() {
            if (currentSpeaker) {
                // Increment speak count for previous speaker (could be original speaker or responder)
                const member = members.find(m => m.name === currentSpeaker);
                if (member) {
                    member.speakCount++;
                }
            }

            // Prioritize response queue
            if (responseQueue.length > 0) {
                // Take next response - don't reset timer, continue within original speaker's time
                currentSpeaker = responseQueue[0];
                responseQueue.shift();
                // Timer continues without reset
            } else if (originalSpeaker) {
                // No more responses, return to original speaker if time remains
                currentSpeaker = originalSpeaker;
                originalSpeaker = null; // Clear since we're returning
                // Don't reset timer - continue with remaining time
            } else if (stack.length > 0) {
                // No responses and no original speaker, take from regular stack
                currentSpeaker = stack[0];
                stack.shift();
                // Reset timer for new speaker
                resetTimer();
                if (currentSpeaker) {
                    startTimer();
                }
            } else {
                currentSpeaker = null;
                originalSpeaker = null;
            }

            updateCurrentSpeaker();
            renderMembers();
            renderStack();
            renderResponseList();
            saveState();
        }

        // Update current speaker display
        function updateCurrentSpeaker() {
            const container = document.getElementById('currentSpeaker');
            const nameEl = document.getElementById('currentSpeakerName');
            const countEl = document.getElementById('currentSpeakerCount');

            if (currentSpeaker) {
                const member = members.find(m => m.name === currentSpeaker);
                container.classList.remove('empty');
                nameEl.textContent = currentSpeaker;
                countEl.textContent = `Speak count: ${member ? member.speakCount : 0}`;
            } else {
                container.classList.add('empty');
                nameEl.textContent = 'No one speaking';
                countEl.textContent = '';
            }
        }

        // Clear stack
        function clearStack() {
            if (confirm('Clear the entire stack and response queue? This will not reset speak counts.')) {
                stack = [];
                responseQueue = [];
                originalSpeaker = null;
                renderStack();
                renderResponseList();
                saveState();
            }
        }

        // Reset all counts
        function resetCounts() {
            if (confirm('Reset all speak counts to 0? This is typically done when moving to a new topic.')) {
                members.forEach(member => {
                    member.speakCount = 0;
                });
                renderMembers();
                saveState();
            }
        }

        // Timer functions
        function startTimer() {
            if (timerRunning) return;
            timerRunning = true;
            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();
                
                if (timerSeconds <= 0) {
                    pauseTimer();
                    showNotification();
                    const display = document.getElementById('timerDisplay');
                    display.classList.add('expired');
                } else if (timerSeconds <= 30) {
                    const display = document.getElementById('timerDisplay');
                    display.classList.add('warning');
                }
            }, 1000);
        }

        function pauseTimer() {
            timerRunning = false;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function resetTimer() {
            pauseTimer();
            timerSeconds = 180;
            const display = document.getElementById('timerDisplay');
            display.classList.remove('warning', 'expired');
            updateTimerDisplay();
            hideNotification();
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timerSeconds / 60);
            const seconds = timerSeconds % 60;
            document.getElementById('timerTime').textContent = 
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function showNotification() {
            const notification = document.getElementById('notification');
            const notificationText = document.getElementById('notificationText');
            
            if (currentSpeaker) {
                notificationText.textContent = `${currentSpeaker}'s 3 minutes are up!`;
            } else {
                notificationText.textContent = 'Time is up!';
            }
            
            notification.classList.add('show');
            
            // Auto-hide after 10 seconds
            setTimeout(() => {
                hideNotification();
            }, 10000);
        }

        function hideNotification() {
            const notification = document.getElementById('notification');
            notification.classList.remove('show');
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
